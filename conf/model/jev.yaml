_target_: recalibench.models.jev.JevModel
version: jev-1.13.0        # pinned; never jev-latest (jev-1.14.0 is newest as of 2026-11)
base_url: https://api.typesafe.ai/v1
api_key_env: TYPESAFE_API_KEY
repeats: 3                 # calls per item, probabilities averaged
concurrency: 8             # org rate limits are only visible in the TypeSafe console
timeout_s: 10
price_per_m_input_tokens: 0.042
max_attempts: 5            # retries 429, 529, other 5xx, timeouts
backoff_s: 1.0
backoff_max_s: 30.0
mock:                      # what mode=mock returns instead of calling the API
  signal: 1.0
  binary_slope: 0.6        # under-confident on yes/no
  choice_temperature: 0.5  # over-confident on choice
  noise_sd: 0.1
